name: Compile PDFs

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Build TeX environment
      run: docker build --tag cv .

    - name: Compile and check PDFs
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          --volume "$PWD:/doc" cv make test

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: cv
        path: |
          build/*.pdf
          build/*.log
          build/quality/
        if-no-files-found: error
